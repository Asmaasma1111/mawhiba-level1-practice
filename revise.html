<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ركن المراجعة">
<meta name="theme-color" content="#10305e">
<title>ركن المراجعة — تدريب مقياس موهبة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span>ركن المراجعة</span>
  </div>
  <nav class="topnav">
    <a class="btn ghost sm" href="index.html">رجوع إلى النماذج</a>
  </nav>
</header>

<main>
  <p class="err wrap" id="need-data" hidden>
    لم يُحمَّل ملف الأسئلة في هذا المتصفّح بعد. افتحي الصفحة الرئيسية أولاً ثم عودي هنا.
  </p>

  <!-- ============ الأنماط ============ -->
  <section class="view" id="view-topics" hidden>
    <div class="wrap">
      <h1>تعرّفي على أنماط الأسئلة</h1>
      <div id="overall" class="overall"></div>

      <div class="row-btns">
        <button class="btn primary" id="mix-all">تدرّبي على كل الأنماط بترتيب عشوائي</button>
      </div>

      <div class="topics" id="topics"></div>

      <section class="panel quiet">
        <div class="row-btns">
          <button class="btn ghost sm" id="reset-progress">امسحي تقدّم المراجعة</button>
        </div>
        <p class="subtle">المراجعة بلا وقت وبلا درجة. لا تُسجَّل هنا أيّ محاولة رسمية،
           ولا يظهر شيء منها في صفحة النتائج.</p>
      </section>
    </div>
  </section>

  <!-- ============ التدريب ============ -->
  <section class="view" id="view-practice" hidden>
    <div class="revbar">
      <div>
        <div class="rev-title" id="practice-title"></div>
        <div class="rev-sub" id="practice-source"></div>
      </div>
      <div class="rev-count" id="practice-count"></div>
    </div>

    <div class="wrap narrow">
      <div id="practice-body"></div>

      <div class="testnav">
        <button class="btn ghost" id="prev-btn">السابق</button>
        <button class="btn ghost" id="again-btn" hidden>جرّبي هذا السؤال مرّة أخرى</button>
        <button class="btn ghost" id="next-btn">التالي</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="shuffle-btn">اخلطي الأسئلة</button>
        <button class="btn primary" id="back-btn">رجوع للأنماط</button>
      </div>
    </div>
  </section>
</main>

<script src="sync-config.js"></script>
<script src="data.js"></script>
<script src="icons.js"></script>
<script src="shapes.js"></script>
<script src="diagrams.js"></script>
<script src="revise.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
